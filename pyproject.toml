[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[project]
name = "synthology"
version = "0.0.1" # major.minor.patch
description = ""
authors = [
  { name = "Vincent Van Schependom", email = "vincent.van.schependom@gmail.com" },
]
license = { file = "LICENSE" }
keywords = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "invoke>=3.0.3",
    "loguru>=0.7.3",
    "pre-commit>=4.3.0",
    "python-dotenv>=1.2.1",
    "rdflib>=7.6.0",
    "ruff>=0.15.15",
    "ty>=0.0.41",
]

# UV workspace configuration


# Optional dependency groups, which can be installed using:
#    uv sync --group dev
# To install all groups, use:
#    uv sync --all-groups
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "hydra-core>=1.3.0",
    "networkx>=3.0",
    "graphviz>=0.20",
    "tqdm>=4.67.3",
    "coverage>=7.10.7",
    "rrn",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["F841"]

[tool.coverage.run]
omit = ["tests/*"]

[tool.uv.workspace]
members = [
    "apps/asp_generator",
    "apps/RRN",
    "apps/ont_generator",
    "apps/OWL2Bench",
    "apps/udm_baseline",
    "apps/data_reporter",
  "apps/KGVisualiser",
]

[tool.uv.sources]
rrn = { workspace = true, editable = true }
udm-baseline = { workspace = true, editable = true }
owl2bench = { workspace = true, editable = true }
