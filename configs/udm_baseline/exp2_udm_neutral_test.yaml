defaults:
  - config
  - _self_

ontology:
  path: "ontologies/family.ttl"

dataset:
  n_train: 0
  n_val: 0
  n_test: 500
  test_fact_cap: null
  test_target_cap: null
  output_dir: "data/exp2/udm_neutral_test"
  seed: 99  # different from train (23) and gold-test (42)

generator:
  min_individuals: 15
  max_individuals: 70
  min_base_relations: 50
  max_base_relations: 200
  base_relations_per_sample: null
  min_types_per_individual: 1
  max_types_per_individual: 2
  enforce_domain_range: true
  allow_reflexive: false
  namespace_base: "http://synthology.org/exp2/fc/neutral/"

materialization:
  reasoner: jena
  jena_profile: owl_micro
  iterative: false

  timing:
    enabled: false

neg_sampling:
  ratio: 1.0
  max_attempts_per_negative: 40

logging:
  level: INFO
